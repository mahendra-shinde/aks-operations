apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: { } # Selects all pods in the namespace
  policyTypes:
  - Ingress
  - Egress
  # No ingress rules: Deny all incoming traffic to the selected pods
  # No egress rules: Deny all outgoing traffic from the selected pods