apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web1 
spec:
  selector:
    matchLabels:
      app: web1
  serviceName: "web1"  # prefix for the pod
  replicas: 3
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: azurefile
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: web1
    spec:
      containers:
      - name: web1
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
      volumes:
      - name: www
        persistentVolumeClaim:
          claimName: www
---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: web1
spec:
  selector:
    app: web1
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
  clusterIP: None