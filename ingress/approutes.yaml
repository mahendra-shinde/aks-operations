apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: approute
  labels:
    app.kubernetes.io/name: approute
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  #- host: <Host>
  - http:
      paths:
      - pathType: Prefix
        path: "/webapp1(.*)"
        backend:
          service:
            name: webapp1-svc
            port: 
              number: 80
      - pathType: Prefix
        path: "/webapp2(.*)"
        backend:
          service:
            name: webapp2-svc
            port: 
              number: 80
      - pathType: Prefix
        path: "/webapp3(.*)"
        backend:
          service:
            name: webapp3-svc
            port: 
              number: 80
