apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keyvault-csi
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"                        # Set to true for using managed identity
    userAssignedIdentityID: be48caae-26c0-4d18-ad7e-4f6a4f5ecfb7   # Set the clientID of the user-assigned managed identity to use
    keyvaultName: kvault121                 # Set to the name of your key vault
    objects:  |
      array:
        - |
          objectName: DBPASSWORD            
          objectType: secret
    tenantId: 027dd762-ab3a-4626-93dc-fdf41e172ccf                # The tenant ID of the key vault